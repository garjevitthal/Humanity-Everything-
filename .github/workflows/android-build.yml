
name: LifeGuard AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -q LifeGuardAI-Android-Starter.zip -d android-src

      - name: Configure Java and Kotlin JVM 17
        run: |
          cat > /tmp/jvm-target.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          import org.gradle.api.JavaVersion

          allprojects {
            afterEvaluate {
              def androidExtension = extensions.findByName("android")
              if (androidExtension != null) {
                androidExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                androidExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
              }

              tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                if (task.name.endsWith("Kotlin") && task.hasProperty("kotlinOptions")) {
                  task.kotlinOptions.jvmTarget = "17"
                }
              }
            }
          }
          EOF

      - name: Build Android APK
        working-directory: android-src
        run: gradle --init-script /tmp/jvm-target.gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeGuardAI-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
